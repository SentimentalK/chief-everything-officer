[package]
name = "ceo-connector"
version = "2.2.1"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
url = "2.5"
libc = "0.2"
rand = "0.8"
base64 = "0.22"
async-trait = "0.1"
serde_json_canonicalizer = "0.3.2"
dirs = "5.0"
# Guided-setup frontend: one small, mature, cross-platform terminal prompt
# backend (crossterm) providing arrow-key Select + editable Text with Tab
# completion. Unneeded features stay disabled to keep the footprint small.
inquire = { version = "0.7", default-features = false, features = ["crossterm"] }

[dev-dependencies]
tempfile = "3.12"
