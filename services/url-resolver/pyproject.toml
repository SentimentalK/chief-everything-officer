[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "url-resolver"
version = "0.2.0"
description = "Lightweight URL metadata resolution capability for Tools monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scrapling[fetchers]==0.4.15",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/url_resolver"]
