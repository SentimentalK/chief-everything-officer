name: CEO State MCP — Test & Publish Image

on:
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - ".github/workflows/ceo-state-mcp-image.yaml"
  workflow_dispatch:

jobs:
  test-build-publish:
    name: Test, Build & Publish CEO State MCP
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Typecheck, Test and Build
        run: |
          cd mcp
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: CI Docker Smoke Build
        run: |
          docker build -t ceo-state-mcp:ci -f mcp/Dockerfile mcp

      - name: CI Policy Asset Verification
        run: |
          docker run --rm --entrypoint sh ceo-state-mcp:ci -c '
            test -s /app/policy/bootstrap.md &&
            test -s /app/policy/router.md &&
            echo "Policy assets verified successfully"
          '

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CEO State MCP image
        uses: docker/build-push-action@v6
        with:
          context: ./mcp
          file: ./mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ceo-state-mcp:latest
