name: CEO Server — Jobs (Redis) Integration

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "services/server/src/jobs/**"
      - "services/server/test/connector.jobs.test.ts"
      - "services/server/test/jobs.v2-*.test.ts"
      - ".github/workflows/server-jobs-redis.yaml"
  push:
    branches: [main]
    paths:
      - "services/server/src/jobs/**"
      - "services/server/test/connector.jobs.test.ts"
      - "services/server/test/jobs.v2-*.test.ts"
      - ".github/workflows/server-jobs-redis.yaml"
  workflow_dispatch:

jobs:
  redis-integration:
    name: Real-Redis V2 jobs integration + connector coordinator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REDIS_PASS: ceo-ci-test-pass
      CEO_REDIS_URL: redis://:ceo-ci-test-pass@127.0.0.1:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated data directory
        run: mkdir -p .tmp/redis-data

      - name: Start isolated Redis with password auth (persistent config)
        run: |
          docker run -d --name ceo-redis-ci -p 6379:6379 \
            -v "${PWD}/.tmp/redis-data:/data" \
            redis:7-alpine \
            redis-server \
              --appendonly yes \
              --appendfsync always \
              --no-appendfsync-on-rewrite no \
              --maxmemory-policy noeviction \
              --requirepass "${REDIS_PASS}" \
              --dir /data

      - name: Wait for Redis (authenticated)
        run: |
          for i in $(seq 1 30); do
            docker exec ceo-redis-ci redis-cli -a "${REDIS_PASS}" --no-auth-warning ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          docker exec ceo-redis-ci redis-cli -a "${REDIS_PASS}" --no-auth-warning ping
          docker exec ceo-redis-ci redis-cli -a "${REDIS_PASS}" --no-auth-warning config get dir

      - name: Install deps
        run: |
          cd services/server
          npm ci --prefer-offline=false --audit=false --fund=false

      # Redis-clearing test files MUST run one at a time (never parallel) so no
      # test deletes another's keys mid-flight. Each run must pass (never skip).
      - name: Jobs integration tests (serial, must NOT skip)
        run: |
          cd services/server
          for f in connector.jobs.test.ts jobs.v2-store.test.ts jobs.v2-query.test.ts jobs.v2-tools.test.ts jobs.v2-schema.test.ts; do
            mkdir -p .tmp
            log=".tmp/${f}.log"
            npx vitest run "test/${f}" > "${log}" 2>&1 || { cat "${log}"; exit 1; }
            cat "${log}"
            if grep -qi "skipped" "${log}"; then
              echo "::error::${f} reported skipped tests - failing gate."
              exit 1
            fi
            grep -qE "[0-9]+ passed" "${log}" || { echo "::error::no passed summary found in ${f}"; exit 1; }
          done

      - name: Typecheck + build
        run: |
          cd services/server
          npm run typecheck
          npm run build

      - name: Run operator acceptance script (deadline enforcement)
        run: |
          cd services/server
          node scripts/verify-redis-op-timeout.mjs

      - name: Cleanup test containers and temp data
        if: always()
        run: |
          docker rm -f ceo-redis-ci 2>/dev/null || true
          rm -rf .tmp/redis-data services/server/.tmp 2>/dev/null || true
