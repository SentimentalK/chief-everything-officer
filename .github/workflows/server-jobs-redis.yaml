name: CEO Server — Jobs (Redis) Integration

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "services/server/src/jobs/**"
      - "services/server/test/jobs.*.test.ts"
      - ".github/workflows/server-jobs-redis.yaml"
  push:
    branches: [main]
    paths:
      - "services/server/src/jobs/**"
      - "services/server/test/jobs.*.test.ts"
      - ".github/workflows/server-jobs-redis.yaml"
  workflow_dispatch:

jobs:
  redis-integration:
    name: Real-Redis jobs leases integration + auth bridge + restart persistence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Test-only credential. The isolated Redis enforces AUTH and every client
      # (node scripts, redis-cli, openJobBridge) must authenticate with it so
      # the production bridge path is exercised, never a simplified client.
      REDIS_PASS: ceo-ci-test-pass
      CEO_REDIS_URL: redis://:ceo-ci-test-pass@127.0.0.1:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated data directory
        run: mkdir -p .tmp/redis-data

      - name: Start isolated Redis with password auth (persistent config)
        run: |
          docker run -d --name ceo-redis-ci -p 6379:6379 \
            -v "${PWD}/.tmp/redis-data:/data" \
            redis:7-alpine \
            redis-server \
              --appendonly yes \
              --appendfsync always \
              --no-appendfsync-on-rewrite no \
              --maxmemory-policy noeviction \
              --requirepass "${REDIS_PASS}" \
              --dir /data

      - name: Wait for Redis (authenticated)
        run: |
          for i in $(seq 1 30); do
            docker exec ceo-redis-ci redis-cli -a "${REDIS_PASS}" --no-auth-warning ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          docker exec ceo-redis-ci redis-cli -a "${REDIS_PASS}" --no-auth-warning ping
          docker exec ceo-redis-ci redis-cli -a "${REDIS_PASS}" --no-auth-warning config get dir

      - name: Install deps
        run: |
          cd services/server
          npm ci --prefer-offline=false --audit=false --fund=false

      # Redis-clearing test files MUST run one at a time (never parallel) so no
      # test deletes another's keys mid-flight. Each run must pass (never skip).
      - name: Jobs integration tests (serial, must NOT skip)
        run: |
          cd services/server
          for f in jobs.redis.test.ts jobs.lease.test.ts jobs.assignment.test.ts jobs.discovery.test.ts jobs.http.test.ts; do
            mkdir -p .tmp
            log=".tmp/${f}.log"
            npx vitest run "test/${f}" > "${log}" 2>&1 || { cat "${log}"; exit 1; }
            cat "${log}"
            if grep -qi "skipped" "${log}"; then
              echo "::error::${f} reported skipped tests - failing gate."
              exit 1
            fi
            grep -qE "[0-9]+ passed" "${log}" || { echo "::error::no passed summary found in ${f}"; exit 1; }
          done

      - name: Typecheck + build
        run: |
          cd services/server
          npm run typecheck
          npm run build

      - name: Run operator acceptance script (deadline enforcement)
        run: |
          cd services/server
          node scripts/verify-redis-op-timeout.mjs

      - name: Production bridge acceptance (openJobBridge over authenticated Redis)
        run: |
          cd services/server
          node --input-type=module -e '
            import { openJobBridge } from "./dist/jobs/bridge.js";

            function waitAvailable(service, timeoutMs = 8000, stepMs = 30) {
              const started = Date.now();
              return new Promise((resolve, reject) => {
                const tick = () => {
                  if (service.available()) return resolve();
                  if (Date.now() - started > timeoutMs) return reject(new Error("bridge never became available"));
                  setTimeout(tick, stepMs);
                };
                tick();
              });
            }

            const scope = { user_id: "usr_accept", workspace_id: "ws_accept" };
            const reqId = "123e4567-e89b-12d3-a456-426614174077";
            const wrk = "wrk-0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d";
            const att = "123e4567-e89b-12d3-a456-4266141740ab";
            const tok = "d".repeat(64);

            // Real production bridge: same config object the server passes, one
            // shared node-redis client with offline queue disabled.
            const bridge = openJobBridge({ bridgeEnabled: true, redisUrl: process.env.CEO_REDIS_URL });
            try {
              await waitAvailable(bridge.service);
              const sub = await bridge.service.submit(scope, {
                request_id: reqId,
                workspace_ref: "tools",
                prompt: "acceptance prompt",
                acceptance: "acceptance done",
                timeout_seconds: 120,
              });
              if (!sub.ok) throw new Error("submit failed: " + JSON.stringify(sub));
              const jobId = sub.view.job_id;
              const c = await bridge.service.claim(scope, jobId, { worker_id: wrk, attempt_id: att, workspace_ref: "tools", lease_token: tok });
              if (!c.ok) throw new Error("claim failed: " + JSON.stringify(c));
              const s = await bridge.service.start(scope, jobId, { worker_id: wrk, attempt_id: att, lease_token: tok });
              if (!s.ok) throw new Error("start failed: " + JSON.stringify(s));
              const h = await bridge.service.heartbeat(scope, jobId, { worker_id: wrk, attempt_id: att, lease_token: tok });
              if (!h.ok) throw new Error("heartbeat failed: " + JSON.stringify(h));
              const g = await bridge.service.get(scope, { job_id: jobId });
              if (!g.ok || g.view.state !== "running") throw new Error("get failed: " + JSON.stringify(g));
              console.log("Production bridge acceptance PASS state=" + g.view.state);
            } finally {
              await bridge.dispose();
            }
          '

      - name: Capture pre-restart durable job and execution lease metadata
        run: |
          cd services/server
          node --input-type=module -e '
            import { writeFileSync, mkdirSync } from "node:fs";
            import { createClient } from "redis";
            import { RedisJobStore, createRedisRunnerFromClient } from "./dist/jobs/redis-store.js";
            import { JobService } from "./dist/jobs/service.js";

            function waitForReady(isReady, timeoutMs = 5000, stepMs = 20) {
              const started = Date.now();
              return new Promise((resolve, reject) => {
                const tick = () => {
                  if (isReady()) return resolve();
                  if (Date.now() - started > timeoutMs) return reject(new Error("runner not ready"));
                  setTimeout(tick, stepMs);
                };
                tick();
              });
            }

            const runner = createRedisRunnerFromClient(
              () =>
                createClient({
                  url: process.env.CEO_REDIS_URL,
                  socket: { reconnectStrategy: false },
                  disableOfflineQueue: true,
                }),
              { opTimeoutMs: 2500 },
            );
            const store = new RedisJobStore(runner);
            const service = new JobService({ store }, () => true);
            try {
              await waitForReady(() => runner.ready());

            const scope = { user_id: "usr_restart", workspace_id: "ws_restart" };
            const reqId = "123e4567-e89b-12d3-a456-426614174099";
            const wrk = "wrk-0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d";
            const att = "123e4567-e89b-12d3-a456-4266141740ab";
            const tok = "e".repeat(64);
            const res = await service.submit(scope, {
              request_id: reqId,
              workspace_ref: "tools",
              prompt: "restart test persistence job",
              acceptance: "survives force-kill and replay",
              timeout_seconds: 300,
            });
            if (!res.ok) throw new Error("Failed pre-restart submit: " + JSON.stringify(res));

            const jobId = res.view.job_id;
            const claim = await service.claim(scope, jobId, { worker_id: wrk, attempt_id: att, workspace_ref: "tools", lease_token: tok });
            if (!claim.ok) throw new Error("pre-restart claim failed: " + JSON.stringify(claim));
            const start = await service.start(scope, jobId, { worker_id: wrk, attempt_id: att, lease_token: tok });
            if (!start.ok) throw new Error("pre-restart start failed: " + JSON.stringify(start));
            await service.heartbeat(scope, jobId, { worker_id: wrk, attempt_id: att, lease_token: tok });

            const job = await store.getJob(jobId);
            if (!job) throw new Error("Job not found immediately after submit");
            const placeholder = await store.getPlaceholder(scope, reqId);
            if (!placeholder) throw new Error("Placeholder not found immediately after submit");
            const streamLen = await store.streamLength();

            const expected = {
              job_id: job.job_id,
              request_id: job.request_id,
              request_digest: job.request_digest,
              user_id: job.user_id,
              workspace_id: job.workspace_id,
              prompt: job.prompt,
              acceptance: job.acceptance,
              status: job.status,
              created_at_ms: job.created_at_ms,
              claim_deadline_ms: job.claim_deadline_ms,
              stream_entry_id: job.stream_entry_id,
              execution_worker_id: job.execution && job.execution.worker_id,
              execution_attempt_id: job.execution && job.execution.attempt_id,
              execution_phase: job.execution && job.execution.phase,
              execution_claimed_at_ms: job.execution && job.execution.claimed_at_ms,
              execution_started_at_ms: job.execution && job.execution.started_at_ms,
              execution_deadline_ms: job.execution && job.execution.execution_deadline_ms,
              execution_lease_expires_at_ms: job.execution && job.execution.lease_expires_at_ms,
              stream_length_before: streamLen,
            };
            mkdirSync(".tmp", { recursive: true });
            writeFileSync(".tmp/restart-expected.json", JSON.stringify(expected, null, 2));
            console.log("Pre-restart state recorded:", expected);
            } finally {
              await runner.dispose();
            }
          '

      - name: Force-stop old Redis and restart on the SAME volume (AUTH retained)
        run: |
          docker kill --signal KILL ceo-redis-ci || true
          docker rm -f ceo-redis-ci || true
          docker run -d --name ceo-redis-ci-restarted -p 6379:6379 \
            -v "${PWD}/.tmp/redis-data:/data" \
            redis:7-alpine \
            redis-server \
              --appendonly yes --appendfsync always \
              --no-appendfsync-on-rewrite no --maxmemory-policy noeviction \
              --requirepass "${REDIS_PASS}" --dir /data
          for i in $(seq 1 30); do
            docker exec ceo-redis-ci-restarted redis-cli -a "${REDIS_PASS}" --no-auth-warning ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          docker exec ceo-redis-ci-restarted redis-cli -a "${REDIS_PASS}" --no-auth-warning ping

      - name: Verify job, dedupe, stream AND execution lease survived the forced restart
        run: |
          cd services/server
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { createClient } from "redis";
            import { RedisJobStore, createRedisRunnerFromClient } from "./dist/jobs/redis-store.js";
            import { JobService } from "./dist/jobs/service.js";

            const expected = JSON.parse(readFileSync(".tmp/restart-expected.json", "utf8"));

            function waitForReady(isReady, timeoutMs = 5000, stepMs = 20) {
              const started = Date.now();
              return new Promise((resolve, reject) => {
                const tick = () => {
                  if (isReady()) return resolve();
                  if (Date.now() - started > timeoutMs) return reject(new Error("runner not ready"));
                  setTimeout(tick, stepMs);
                };
                tick();
              });
            }

            const runner = createRedisRunnerFromClient(
              () =>
                createClient({
                  url: process.env.CEO_REDIS_URL,
                  socket: { reconnectStrategy: false },
                  disableOfflineQueue: true,
                }),
              { opTimeoutMs: 2500 },
            );
            const store = new RedisJobStore(runner);
            const service = new JobService({ store }, () => true);
            try {
              await waitForReady(() => runner.ready());

            const scope = { user_id: expected.user_id, workspace_id: expected.workspace_id };
            const wrk = "wrk-0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d";
            const att = "123e4567-e89b-12d3-a456-4266141740ab";
            const tok = "e".repeat(64);

            // 1. Exact match on persisted job record incl. the execution lease.
            const job = await store.getJob(expected.job_id);
            if (!job) throw new Error("Job missing after restart");
            if (job.job_id !== expected.job_id) throw new Error("job_id mismatch");
            if (job.request_id !== expected.request_id) throw new Error("request_id mismatch");
            if (job.request_digest !== expected.request_digest) throw new Error("request_digest mismatch");
            if (job.created_at_ms !== expected.created_at_ms) throw new Error("created_at_ms mismatch");
            if (job.claim_deadline_ms !== expected.claim_deadline_ms) throw new Error("claim_deadline_ms mismatch");
            if (job.stream_entry_id !== expected.stream_entry_id) throw new Error("stream_entry_id mismatch");
            if (job.status !== "queued") throw new Error("status mismatch: " + job.status);
            if (!job.execution) throw new Error("execution lease missing after restart");
            if (job.execution.worker_id !== expected.execution_worker_id) throw new Error("execution.worker_id mismatch");
            if (job.execution.attempt_id !== expected.execution_attempt_id) throw new Error("execution.attempt_id mismatch");
            if (job.execution.phase !== expected.execution_phase) throw new Error("execution.phase mismatch");
            if (job.execution.claimed_at_ms !== expected.execution_claimed_at_ms) throw new Error("execution.claimed_at_ms mismatch");
            if (job.execution.started_at_ms !== expected.execution_started_at_ms) throw new Error("execution.started_at_ms mismatch");
            if (job.execution.execution_deadline_ms !== expected.execution_deadline_ms) throw new Error("execution.execution_deadline_ms mismatch");
            if (job.execution.lease_expires_at_ms !== expected.execution_lease_expires_at_ms) throw new Error("execution.lease_expires_at_ms mismatch");

            // 2. get still derives running from the persisted lease.
            const got = await service.get(scope, { job_id: expected.job_id });
            if (!got.ok || got.view.state !== "running") throw new Error("get did not derive running: " + JSON.stringify(got));

            // 3. The original attempt can still heartbeat after the restart.
            const hb = await service.heartbeat(scope, expected.job_id, { worker_id: wrk, attempt_id: att, lease_token: tok });
            if (!hb.ok) throw new Error("post-restart heartbeat failed: " + JSON.stringify(hb));

            // 4. Dedupe placeholder + replay submit return running (no re-queue).
            const ph = await store.getPlaceholder(scope, expected.request_id);
            if (!ph) throw new Error("Dedupe placeholder missing after restart");
            if (ph.job_id !== expected.job_id) throw new Error("placeholder job_id mismatch");
            const replayRes = await service.submit(scope, {
              request_id: expected.request_id,
              workspace_ref: "tools",
              prompt: expected.prompt,
              acceptance: expected.acceptance,
              timeout_seconds: 300,
            });
            if (!replayRes.ok) throw new Error("Replay submission failed: " + JSON.stringify(replayRes));
            if (!replayRes.view.replayed) throw new Error("Expected replayed: true on post-restart submit");
            if (replayRes.view.job_id !== expected.job_id) throw new Error("Replay returned different job_id");
            if (replayRes.view.state !== "running") throw new Error("Replay state not running: " + replayRes.view.state);

            // 5. Stream length unchanged (no duplicate XADD on replay).
            const streamLenAfter = await store.streamLength();
            if (streamLenAfter !== expected.stream_length_before) {
              throw new Error(`Stream length changed from ${expected.stream_length_before} to ${streamLenAfter}`);
            }

            console.log("Post-restart persistence, execution lease, replay dedupe, and stream invariants verified successfully!");
            } finally {
              await runner.dispose();
            }
          '

      - name: Cleanup test containers and temp data
        if: always()
        run: |
          docker rm -f ceo-redis-ci ceo-redis-ci-restarted 2>/dev/null || true
          rm -rf .tmp/redis-data services/server/.tmp 2>/dev/null || true
