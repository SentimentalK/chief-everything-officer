name: CEO Connector — Real Connector Core Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "connector/**"
      - ".github/workflows/connector.yaml"
  push:
    branches: [main]
    paths:
      - "connector/**"
      - ".github/workflows/connector.yaml"
  workflow_dispatch:

jobs:
  rust-connector-gate:
    name: Connector fmt / test / clippy / build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt --check
        run: cd connector && cargo fmt --check
      - name: cargo test --locked
        run: cd connector && cargo test --locked
      - name: cargo clippy -D warnings
        run: cd connector && cargo clippy --locked --all-targets -- -D warnings
      - name: cargo build --locked
        run: cd connector && cargo build --locked
