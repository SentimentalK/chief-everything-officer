name: CEO Server — Test & Publish Image

on:
  push:
    branches: [main]
    paths:
      - "services/server/**"
      - ".github/workflows/server-image.yaml"
  pull_request:
    branches: [main]
    paths:
      - "services/server/**"
      - ".github/workflows/server-image.yaml"
  workflow_dispatch:

jobs:
  redis-integration:
    name: Redis Integration Gate
    uses: ./.github/workflows/server-jobs-redis.yaml

  test-build-publish:
    name: Test, Build & Publish CEO Server
    needs: [redis-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Typecheck, Test and Build Server
        run: |
          cd services/server
          npm ci --prefer-offline=false --audit=false --fund=false
          npm run typecheck
          npm test
          npm run build

      - name: CI Docker Smoke Build
        run: |
          docker build -t ceo-server:ci --build-arg BUILD_SHA=${{ github.sha }} -f services/server/Dockerfile services/server

      - name: CI Policy Assets Verification
        run: |
          docker run --rm --entrypoint sh ceo-server:ci -c '
            test -s /app/policy/bootstrap.md &&
            test -s /app/policy/journal.md &&
            test -s /app/policy/personal.md &&
            test -s /app/policy/resources.md &&
            test -s /app/policy/tasks.md &&
            echo "All policy files verified successfully"
          '

      - name: Set up QEMU
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image tag
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "IMAGE_TAG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ceo-server:latest" >> "$GITHUB_ENV"

      - name: Build and push CEO Server image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./services/server
          file: ./services/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE_TAG }}
