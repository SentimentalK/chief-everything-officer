server {
    listen 8080;
    server_name _;

    absolute_redirect off;
    port_in_redirect off;

    # Health check endpoint for container probes
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}';
    }

    # Redirect /audit to /audit/ relative to avoid leaking internal port/host
    location = /audit {
        return 301 /audit/;
    }

    # Static assets: return 404 if not found (do not fall back to SPA index.html)
    location ^~ /audit/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # SPA routing for audit web console
    location /audit/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /audit/index.html;
    }

    # Root and /login routes reuse the same bundle
    location = / {
        root /usr/share/nginx/html;
        try_files /audit/index.html =404;
    }

    location /login {
        root /usr/share/nginx/html;
        try_files /audit/index.html =404;
    }

    # Explicitly return 404 for unhandled requests (frontend does not handle API)
    location / {
        return 404;
    }
}
